<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tala</title>
<script src="chart.umd.min.js"></script>
<style>
:root {
  --bg: #f7f5f0; --panel: #ffffff; --ink: #1d1b16; --muted: #6f6a5f; --line: #e7e2d8;
  --accent: #0f766e; --accent-ink: #ffffff; --me: #0f766e; --warn: #b45309; --bad: #b91c1c;
  --chip: #efece4;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14130f; --panel: #1d1c17; --ink: #f1eee6; --muted: #a29d91; --line: #2f2d26;
          --accent: #2dd4bf; --accent-ink: #062b27; --me: #115e59; --chip: #26251f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100vh; }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; } aside { display: none; } }
header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
.badge { margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--chip); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.badge.off .dot { background: var(--warn); }
main { display: flex; flex-direction: column; min-height: 0; }
#log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 720px; }
.msg.user { align-self: flex-end; background: var(--me); color: #fff; padding: 9px 14px; border-radius: 16px 16px 4px 16px; }
.msg.user img { display: block; max-width: 180px; border-radius: 10px; margin-top: 6px; }
.msg.user .file { font-size: 13px; opacity: .85; }
.msg.bot { align-self: flex-start; width: 100%; }
.msg.bot .text { white-space: pre-wrap; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 8px; max-width: 560px; }
.card h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.card canvas { max-height: 260px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td { padding: 5px 4px; border-top: 1px solid var(--line); }
td.amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.cat { color: var(--muted); }
td.d { white-space: nowrap; color: var(--muted); }
.total { font-weight: 600; margin-top: 6px; text-align: right; }
.bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 4px 0 10px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.over > i { background: var(--bad); }
.brow { display: flex; justify-content: space-between; font-size: 13.5px; }
.thinking { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.orb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.6); opacity: .5; } }
.error { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 10px; }
.chips button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 99px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
form { display: flex; gap: 8px; padding: 12px 20px 18px; border-top: 1px solid var(--line); align-items: flex-end; }
#attachments { display: flex; gap: 6px; padding: 0 20px; flex-wrap: wrap; }
#attachments span { font-size: 12px; background: var(--chip); padding: 3px 8px; border-radius: 8px; }
textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-height: 44px; max-height: 140px; }
.icon { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; font-size: 18px; flex-shrink: 0; }
.icon.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.icon.rec { background: var(--bad); color: #fff; border-color: transparent; animation: pulse 1.1s ease-in-out infinite; }
aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
aside .head { padding: 16px 18px 8px; }
aside .head small { color: var(--muted); }
aside .big { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
#filter { font-size: 12px; color: var(--accent); min-height: 18px; }
#filter button { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; text-decoration: underline; }
#budgets { padding: 0 18px; }
#ledger { overflow-y: auto; padding: 0 18px 18px; flex: 1; }
.flash { animation: flash 1.2s ease; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 25%, transparent); } }
</style>
</head>
<body>
<div class="app">
  <main>
    <header>
      <h1>Tala</h1><span style="color:var(--muted);font-size:13px">your offline money log</span>
      <span class="badge" id="net"><span class="dot"></span><span id="netText">On-device AI</span></span>
    </header>
    <div id="log"></div>
    <div class="chips" id="chips"></div>
    <div id="attachments"></div>
    <form id="form">
      <button type="button" class="icon" id="attach" title="Attach receipt photo or PDF statement" aria-label="Attach">📎</button>
      <input type="file" id="file" accept="image/*,application/pdf" multiple hidden>
      <textarea id="input" rows="1" placeholder="Type or speak: “nag-grab ako 230, lunch 150”"></textarea>
      <button type="button" class="icon" id="mic" title="Hold to talk, or tap to start/stop" aria-label="Voice">🎙️</button>
      <button type="submit" class="icon primary" aria-label="Send">➤</button>
    </form>
  </main>
  <aside>
    <div class="head">
      <small>Spent this month</small>
      <div class="big" id="monthTotal">₱0</div>
      <div id="filter"></div>
    </div>
    <div id="budgets"></div>
    <div id="ledger"></div>
  </aside>
</div>
<script>
const $ = (id) => document.getElementById(id);
const peso = (n) => "₱" + Number(n).toLocaleString("en-PH", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const day = (iso) => new Date(iso + "T00:00").toLocaleDateString("en-PH", { month: "short", day: "numeric" });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const history = [];
let pending = [];
let view = {};

const SUGGESTIONS = [
  "Nag-jeep ako 15 tapos lunch sa Jollibee 165",
  "Saan napunta pera ko this month?",
  "Compare my food spending per week",
  "Kumusta budget ko?",
];
$("chips").innerHTML = SUGGESTIONS.map((s) => `<button type="button">${esc(s)}</button>`).join("");
$("chips").onclick = (e) => { if (e.target.tagName === "BUTTON") send(e.target.textContent); };

function netBadge() {
  const off = !navigator.onLine;
  $("net").classList.toggle("off", off);
  $("netText").textContent = off ? "Offline · AI still on this laptop" : "On-device AI";
}
addEventListener("online", netBadge); addEventListener("offline", netBadge); netBadge();

function addMsg(role, html) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = html;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

function rowsTable(rows) {
  return `<table>${rows.map((r) => `<tr><td class="d">${esc(day(r.date))}</td><td>${esc(r.merchant || r.note || "")}</td><td class="cat">${esc(r.category)}</td><td class="amt">${peso(r.amount)}</td></tr>`).join("")}</table>`;
}

function budgetsHtml(rows) {
  return rows.map((b) => {
    const pct = Math.min(100, (b.spent / b.budget) * 100);
    const over = b.spent > b.budget;
    return `<div class="brow"><span>${esc(b.category)}</span><span>${peso(b.spent)} / ${peso(b.budget)}</span></div>
            <div class="bar ${over ? "over" : ""}"><i style="width:${pct}%"></i></div>`;
  }).join("");
}

function renderBlock(b, into) {
  const card = document.createElement("div");
  card.className = "card";
  if (b.type === "chart") {
    card.innerHTML = `<h4>${esc(b.title)}</h4><canvas></canvas><div class="total">Total ${peso(b.total)}</div>`;
    into.appendChild(card);
    const css = getComputedStyle(document.documentElement);
    const accent = css.getPropertyValue("--accent").trim();
    const palette = ["#0f766e", "#d97706", "#7c3aed", "#db2777", "#2563eb", "#65a30d", "#dc2626", "#0891b2", "#78716c"];
    new Chart(card.querySelector("canvas"), {
      type: b.kind,
      data: { labels: b.labels, datasets: [{ data: b.values, label: "₱", backgroundColor: b.kind === "doughnut" ? palette : accent, borderColor: accent, tension: 0.3, fill: false }] },
      options: { plugins: { legend: { display: b.kind === "doughnut", position: "right", labels: { color: css.getPropertyValue("--ink") } },
                 tooltip: { callbacks: { label: (c) => peso(c.parsed.y ?? c.parsed) } } },
                 scales: b.kind === "doughnut" ? {} : { y: { ticks: { callback: (v) => peso(v), color: css.getPropertyValue("--muted") } }, x: { ticks: { color: css.getPropertyValue("--muted") } } },
                 animation: { duration: 700 } },
    });
  } else if (b.type === "table") {
    card.innerHTML = `<h4>${esc(b.title)}</h4>${rowsTable(b.rows)}`;
    into.appendChild(card);
  } else if (b.type === "budget") {
    card.innerHTML = `<h4>${esc(b.title)}</h4>${budgetsHtml(b.rows)}`;
    into.appendChild(card);
  } else if (b.type === "view") {
    view = b.filter || {};
    loadLedger(true);
  }
}

async function loadLedger(flash) {
  const q = new URLSearchParams(view);
  const r = await fetch("/api/expenses?" + q);
  if (!r.ok) return;
  const d = await r.json();
  $("monthTotal").textContent = peso(d.month_total);
  $("budgets").innerHTML = d.budgets.length ? budgetsHtml(d.budgets) : "";
  const label = Object.entries(view).map(([k, v]) => `${k}: ${v}`).join(" · ");
  $("filter").innerHTML = label ? `Showing ${esc(label)} <button id="clear">clear</button>` : "";
  if (label) $("clear").onclick = () => { view = {}; loadLedger(); };
  $("ledger").innerHTML = rowsTable(d.rows);
  if (flash) { $("ledger").classList.remove("flash"); void $("ledger").offsetWidth; $("ledger").classList.add("flash"); }
}

async function send(text, source = "chat") {
  text = (text ?? $("input").value).trim();
  const files = pending; pending = []; $("attachments").innerHTML = "";
  if (!text && !files.length) return;
  $("input").value = "";
  $("chips").style.display = "none";
  const fileHtml = files.map((f) => f.type.startsWith("image/") ? `<img src="${URL.createObjectURL(f)}" alt="">` : `<div class="file">📄 ${esc(f.name)}</div>`).join("");
  addMsg("user", (source === "voice" ? "🎙️ " : "") + esc(text) + fileHtml);
  const bot = addMsg("bot", `<div class="thinking"><span class="orb"></span>Thinking on this laptop…</div>`);
  const fd = new FormData();
  fd.append("message", text); fd.append("source", source); fd.append("history", JSON.stringify(history));
  files.forEach((f) => fd.append("files", f));
  const t0 = performance.now();
  const tick = setInterval(() => { const l = bot.querySelector(".thinking"); if (l) l.lastChild.textContent = `Thinking on this laptop… ${((performance.now() - t0) / 1000).toFixed(0)}s`; }, 500);
  try {
    const r = await fetch("/api/chat", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "Something went wrong.");
    bot.innerHTML = `<div class="text">${esc(d.reply)}</div>`;
    d.blocks.forEach((b) => renderBlock(b, bot));
    bot.insertAdjacentHTML("beforeend", `<div style="font-size:11px;color:var(--muted);margin-top:4px">${((performance.now() - t0) / 1000).toFixed(1)}s · on-device</div>`);
    history.push({ role: "user", content: text || "(attachment)" }, { role: "assistant", content: d.reply });
    if (d.blocks.some((b) => b.changed)) loadLedger(true);
  } catch (e) {
    bot.innerHTML = `<div class="text error">${esc(e.message)}</div>`;
  }
  clearInterval(tick);
  $("log").scrollTop = $("log").scrollHeight;
}

$("form").onsubmit = (e) => { e.preventDefault(); send(); };
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };

$("attach").onclick = () => $("file").click();
function addFiles(list) {
  pending.push(...list);
  $("attachments").innerHTML = pending.map((f) => `<span>${f.type.startsWith("image/") ? "🖼️" : "📄"} ${esc(f.name)}</span>`).join("");
}
$("file").onchange = (e) => { addFiles([...e.target.files]); e.target.value = ""; };
document.addEventListener("paste", (e) => { const f = [...e.clipboardData.files]; if (f.length) addFiles(f); });
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); addFiles([...e.dataTransfer.files]); });

// Voice: tap to start, tap to stop. Transcribed locally by whisper.cpp, then sent.
let rec = null;
$("mic").onclick = async () => {
  if (rec) { rec.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { addMsg("bot", `<div class="text error">Microphone permission is needed for voice.</div>`); return; }
  const chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = (e) => chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    $("mic").classList.remove("rec"); rec = null;
    $("input").placeholder = "Transcribing on this laptop…";
    const fd = new FormData();
    fd.append("audio", new Blob(chunks, { type: chunks[0]?.type || "audio/webm" }), "voice.webm");
    try {
      const r = await fetch("/api/transcribe", { method: "POST", body: fd });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail);
      if (d.text) send(d.text, "voice");
    } catch (e) {
      addMsg("bot", `<div class="text error">${esc(e.message || "Could not transcribe.")}</div>`);
    }
    $("input").placeholder = "Type or speak: “nag-grab ako 230, lunch 150”";
  };
  rec.start();
  $("mic").classList.add("rec");
};

loadLedger();
</script>
</body>
</html>
